{% set name = "napari-locpix" %}
{% set version = "0.0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 28c9341ab921ec8fa00a81d12c0503b50d6d7ea226563e1b28b58cd885f40347

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.8
  run:
    - napari
    - numpy
    - polars
    - pyarrow
    - python >=3.8
    - qtpy

test:
  imports:
    - napari_locpix
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/oubino/napari-locpix
  summary: Load in SMLM data and annotate within napari
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - oubino
